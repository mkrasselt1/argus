[project]
name = "argus"
version = "0.1.0"
description = "Argus — read-only security & asset management dashboard for deployed systems (hosts, NAS, routers, Docker)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlmodel>=0.0.22",
    "jinja2>=3.1",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "paramiko>=3.5",
    "docker>=7.1",
    "apscheduler>=3.10",
    "python-multipart>=0.0.12",
    "itsdangerous>=2.2",
    "cryptography>=43.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.7"]

[project.scripts]
argus-agent = "app.agent:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
