name: Build & publish Docker image

# Publishes a multi-arch image (amd64 + arm64) to Docker Hub on every version
# tag (e.g. v1.2.0) and on pushes to main (tag: latest). Set two repository
# secrets first: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (an access token).
# To publish to GHCR instead, see the commented block below.

on:
  push:
    branches: [main]
    tags: ["v*"]

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/argus

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.ref_name }}

# --- GHCR alternative (no Docker Hub account needed) -------------------------
# Replace the login + env.IMAGE above with:
#   env:   IMAGE: ghcr.io/${{ github.repository_owner }}/argus
#   permissions: { packages: write, contents: read }
#   - uses: docker/login-action@v3
#     with: { registry: ghcr.io, username: ${{ github.actor }}, password: ${{ secrets.GITHUB_TOKEN }} }
