services:
  argus:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: argus:${APP_VERSION:-dev}
    container_name: argus
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SECSCAN_SCAN_INTERVAL_MINUTES: "360"
      SECSCAN_SCAN_RETENTION: "20"
      # Production secrets — set these in a .env file next to this compose file.
      SECSCAN_ADMIN_PASSWORD: "${SECSCAN_ADMIN_PASSWORD:?set a UI login password}"
      SECSCAN_SECRET_KEY: "${SECSCAN_SECRET_KEY:?set a random session secret}"
      SECSCAN_CRYPTO_KEY: "${SECSCAN_CRYPTO_KEY:-}"
      SECSCAN_INGEST_TOKEN: "${SECSCAN_INGEST_TOKEN:?set an ingest token}"
    volumes:
      # Persistent, revision-safe database (survives redeploys).
      - secscan-data:/data
      # !!! DANGER — DO NOT MOUNT THE RAW DOCKER SOCKET HERE !!!
      # Mounting /var/run/docker.sock gives this container effective ROOT on the
      # host (even ":ro" — the socket API lets a caller start a privileged
      # container and escape). The dashboard does NOT need it: run the `docker`
      # collector on a dedicated EDGE AGENT next to the Docker host, or expose
      # the daemon through a read-only docker-socket-proxy (Tecnativa) that only
      # permits the /images and /containers GET endpoints, and point the
      # collector's base_url at that proxy. Only uncomment if you fully accept
      # the host-takeover risk:
      # - /var/run/docker.sock:/var/run/docker.sock:ro
    # Hardening: the tool never needs to write to its own filesystem.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  secscan-data:
