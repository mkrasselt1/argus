<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login · Argus</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main style="max-width:360px;margin:12vh auto">
    <h1>🛡️ Argus</h1>
    {% if error %}<p class="badge err" style="display:inline-block">Falsches Passwort</p>{% endif %}
    <form method="post" action="/login" class="form">
      <input type="hidden" name="next" value="{{ next }}">
      <label>Passwort <input type="password" name="password" autofocus required></label>
      <button class="btn" type="submit">Anmelden</button>
    </form>
  </main>
</body>
</html>
