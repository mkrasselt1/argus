<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Argus{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <a href="/" class="brand">🛡️ Argus</a>
    <nav>
      <a href="/">Übersicht</a>
      <a href="/agents">Agenten</a>
      <a href="/systems/new">+ System</a>
      <form method="post" action="/scan-all" class="inline">
        {% include "_csrf.html" %}
        <button type="submit" class="btn small">Alle scannen</button>
      </form>
      {% if auth_enabled %}<form method="post" action="/logout" class="inline">
        {% include "_csrf.html" %}
        <button type="submit" class="btn small muted">Logout</button>
      </form>{% endif %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>read-only Monitoring · v{{ version or "" }}</footer>
  <script>
    // Convert UTC <time data-localdt> elements to the viewer's local timezone.
    (function () {
      const dtf = new Intl.DateTimeFormat(undefined,
        { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
      const df = new Intl.DateTimeFormat(undefined,
        { year: "numeric", month: "2-digit", day: "2-digit" });
      document.querySelectorAll("time[data-localdt]").forEach(function (el) {
        const iso = el.getAttribute("datetime");
        const d = new Date(iso);
        if (isNaN(d.getTime())) return;
        el.textContent = (el.hasAttribute("data-dateonly") ? df : dtf).format(d);
        el.title = iso;
      });
    })();
    document.addEventListener("click", function (e) {
      const btn = e.target.closest(".copy");
      if (!btn) return;
      const cmd = btn.getAttribute("data-cmd") || "";
      navigator.clipboard.writeText(cmd).then(() => {
        const old = btn.textContent;
        btn.textContent = "kopiert ✓";
        btn.classList.add("done");
        setTimeout(() => { btn.textContent = old; btn.classList.remove("done"); }, 1500);
      });
    });
  </script>
</body>
</html>
